name: Live smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test deployed game end-to-end
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-shift-live-76eo.vercel.app"

          echo "1. Checking public pages"
          curl -fsS "$BASE/" | grep -q "AI SHIFT LIVE"
          curl -fsS "$BASE/host" | grep -q "Создать игровую сессию"
          curl -fsS "$BASE/team" | grep -q "Подключиться"

          echo "2. Creating session"
          CREATE=$(curl -fsS -X POST "$BASE/api/create")
          CODE=$(echo "$CREATE" | jq -r '.code')
          HOST=$(echo "$CREATE" | jq -r '.hostToken')
          test "$CODE" != "null"
          test "$HOST" != "null"

          echo "3. Joining test team"
          JOIN=$(curl -fsS -X POST "$BASE/api/join" -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\",\"name\":\"Smoke Test Team\",\"members\":\"QA\",\"company\":\"Test Company\"}")
          TEAM=$(echo "$JOIN" | jq -r '.teamId')
          TTOKEN=$(echo "$JOIN" | jq -r '.teamToken')
          test "$TEAM" != "null"
          test "$TTOKEN" != "null"

          echo "4. Running six rounds"
          CHOICES=("risk_tiers" "redesign_roles" "human_themes" "red_team" "degraded_mode" "new_metrics")
          for ROUND in 1 2 3 4 5 6; do
            curl -fsS -X POST "$BASE/api/start" -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\",\"hostToken\":\"$HOST\",\"round\":$ROUND}" | jq -e '.ok == true' >/dev/null
            INDEX=$((ROUND-1))
            CHOICE="${CHOICES[$INDEX]}"
            SUBMIT=$(curl -fsS -X POST "$BASE/api/submit" -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\",\"teamId\":\"$TEAM\",\"teamToken\":\"$TTOKEN\",\"round\":$ROUND,\"choice\":\"$CHOICE\"}")
            echo "$SUBMIT" | jq -e '.ok == true' >/dev/null
            echo "$SUBMIT" | jq -e '.optionTitle != null' >/dev/null
          done

          echo "5. Finishing simulation"
          FIN=$(curl -fsS -X POST "$BASE/api/finish" -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\",\"hostToken\":\"$HOST\"}")
          echo "$FIN" | jq -e '.ok == true' >/dev/null
          echo "$FIN" | jq -e '.summary.distribution | length >= 1' >/dev/null

          FINAL=$(curl -fsS "$BASE/api/state?code=$CODE")
          echo "$FINAL" | jq -e '.meta.status == "finished"' >/dev/null
          echo "$FINAL" | jq -e '.teams[0].result.title != null' >/dev/null
          echo "$FINAL" | jq -e '.teams[0].result.choices | length == 6' >/dev/null
          echo "$FINAL" | jq -e '.teams[0].result.metrics.efficiency >= 0 and .teams[0].result.metrics.efficiency <= 100' >/dev/null
          echo "$FINAL" | jq -e '.teams[0].result.metrics.dependency >= 0 and .teams[0].result.metrics.dependency <= 100' >/dev/null
          echo "$FINAL" | jq -e '.teams[0].result.hostReport.readAloud | length > 300' >/dev/null
          echo "$FINAL" | jq -e '.teams[0].result.hostReport.rounds | length == 6' >/dev/null

          echo "SIX-ROUND TRAJECTORY + HOST REPORT SMOKE TEST PASSED"
